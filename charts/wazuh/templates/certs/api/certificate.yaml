{{- if and .Values.wazuh.enabled (include "wazuh.api.certificate.enabled" .) }}
{{- $cert := .Values.wazuh.api.certificate }}
{{- $issuer := $cert.issuerRef }}
{{- if and (not $issuer.name) (not .Values.certificates.enabled) }}
{{- fail "wazuh.api.certificate needs certificates.enabled (the chart's CA issuer) or wazuh.api.certificate.issuerRef.name" }}
{{- end }}
{{- $names := list }}
{{- if $cert.serviceNames }}
{{- $names = list (include "wazuh.fullname" .) (printf "%s.%s" (include "wazuh.fullname" .) .Release.Namespace) (printf "%s.%s.svc" (include "wazuh.fullname" .) .Release.Namespace) (printf "%s.%s.svc.cluster.local" (include "wazuh.fullname" .) .Release.Namespace) }}
{{- end }}
{{- if include "wazuh.api.gateway.enabled" . }}
{{- $names = append $names .Values.wazuh.api.gateway.host }}
{{- end }}
{{- $names = concat $names ($cert.dnsNames | default list) }}
{{- if not $names }}
{{- fail "wazuh.api.certificate: with serviceNames false, set wazuh.api.gateway.host or wazuh.api.certificate.dnsNames (a public CA only issues public names)" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-manager
spec:
  secretName: api-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  duration: {{ .Values.certificates.duration }}
  renewBefore: {{ .Values.certificates.renewBefore }}
  isCA: false
  # serviceNames: the in-cluster names first (CN = Service name); off: public names only, CN = the first
  commonName: {{ first $names | quote }}
  dnsNames:
    {{- range $names }}
    - {{ . | quote }}
    {{- end }}
  subject:
    organizations:
      - {{ .Values.certificates.subject.organization }}
    countries:
      - {{ .Values.certificates.subject.country }}
    localities:
      - {{ .Values.certificates.subject.locality }}
  issuerRef:
    {{- if $issuer.name }}
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
    group: {{ $issuer.group }}
    {{- else }}
    name: {{ .Values.certificates.issuer.name | default (printf "%s-ca-issuer" (include "wazuh.fullname" .)) }}
    {{- if eq .Values.certificates.issuer.type "ClusterIssuer" }}
    kind: ClusterIssuer
    {{- end }}
    {{- end }}
{{- end }}
