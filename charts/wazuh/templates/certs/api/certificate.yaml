{{- if and .Values.wazuh.enabled (include "wazuh.api.certificate.enabled" .) }}
{{- $issuer := .Values.wazuh.api.certificate.issuerRef }}
{{- if and (not $issuer.name) (not .Values.certificates.enabled) }}
{{- fail "wazuh.api.certificate needs certificates.enabled (the chart's CA issuer) or wazuh.api.certificate.issuerRef.name" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-manager
spec:
  secretName: api-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  duration: {{ .Values.certificates.duration }}
  renewBefore: {{ .Values.certificates.renewBefore }}
  isCA: false
  commonName: {{ include "wazuh.fullname" . }}
  dnsNames:
    - {{ include "wazuh.fullname" . }}
    - {{ include "wazuh.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "wazuh.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "wazuh.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- if .Values.wazuh.api.gateway.enabled }}
    - {{ .Values.wazuh.api.gateway.host | quote }}
    {{- end }}
    {{- range .Values.wazuh.api.certificate.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  subject:
    organizations:
      - {{ .Values.certificates.subject.organization }}
    countries:
      - {{ .Values.certificates.subject.country }}
    localities:
      - {{ .Values.certificates.subject.locality }}
  issuerRef:
    {{- if $issuer.name }}
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
    group: {{ $issuer.group }}
    {{- else }}
    name: {{ .Values.certificates.issuer.name | default (printf "%s-ca-issuer" (include "wazuh.fullname" .)) }}
    {{- if eq .Values.certificates.issuer.type "ClusterIssuer" }}
    kind: ClusterIssuer
    {{- end }}
    {{- end }}
{{- end }}
