{{- if and .Values.certificates.enabled .Values.dashboard.enabled .Values.dashboard.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "wazuh.fullname" . }}-dashboard
  validation:
    hostname: {{ .Values.dashboard.ingress.host | quote }}
    caCertificateRefs:
      - kind: Secret
        name: dashboard-tls
        group: {{ .group | default "" | quote }}
{{- end }}
