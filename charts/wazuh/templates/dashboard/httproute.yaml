---
{{- if and .Values.dashboard.enabled .Values.dashboard.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-dashboard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "wazuh.fullname" . }}-dashboard
  hostnames:
    - {{ .Values.dashboard.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "wazuh.fullname" . }}-dashboard
          port: {{ .Values.dashboard.service.httpPort }}
{{- end }}
