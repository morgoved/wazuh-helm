apiVersion: v2
name: wazuh
description: Wazuh is a free and open source security platform that unifies XDR and SIEM protection for endpoints and cloud workloads.
type: application
appVersion: 4.14.9
version: 2.2.0
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: security
  artifacthub.io/changes: |
    - kind: added
      description: "wazuh.syslog.protocols selects the workers' syslog transports (tcp, udp or both)"
    - kind: fixed
      description: "The syslog listener, worker ports, Service, NetworkPolicy and LoadBalancer now use the same protocols"
    - kind: fixed
      description: "The LoadBalancer sends syslog to the workers only, not to the master"
    - kind: changed
      description: "Syslog on the LoadBalancer follows wazuh.loadBalancer.ports (syslog-tcp, syslog-udp)"
  artifacthub.io/links: |
    - name: application source
      url: https://github.com/wazuh/wazuh
    - name: kustomize source
      url: https://github.com/wazuh/wazuh-kubernetes
  artifacthub.io/screenshots: |
    - title: Home Page
      url: https://morgoved.github.io/wazuh-helm/images/dashboard.png
    - title: Agent Deployment
      url: https://morgoved.github.io/wazuh-helm/images/agent-deploy.png
    - title: Threat Hunting
      url: https://morgoved.github.io/wazuh-helm/images/threat-hunting.png
home: https://wazuh.com/
